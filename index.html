<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Well Soon, Hunsika!</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      padding: 20px;
      border: 2px solid white;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #6c5ce7;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #a29bfe;
    }
    .heart {
      font-size: 50px;
      animation: heartbeat 1s infinite;
      margin: 20px 0;
    }
    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }
    footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #dfe6e9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Get Well Soon, Hunsika!</h1>
    <p>Sending lots of positive vibes and love to help you feel better. 💜</p>
    <div class="heart">💜</div>
    <button onclick="showMessage()">Click for a Surprise</button>
    <footer>
      You’re stronger than you know, and brighter days are ahead!
    </footer>
  </div>

  <script>
    function showMessage() {
      const message = "The world is brighter with you in it. Rest well and shine again soon!";
      alert(message);
    }
  </script>
</body>
</html>
